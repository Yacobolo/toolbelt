version: 2

project_name: sourcebook

builds:
  - id: sourcebook
    main: ./cmd/sourcebook
    binary: sourcebook
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version=v{{ .Env.SOURCEBOOK_VERSION }}

archives:
  - ids:
      - sourcebook
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: sourcebook_{{ .Env.SOURCEBOOK_VERSION }}_{{ .Os }}_{{ .Arch }}
    files:
      - none*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Env.SOURCEBOOK_VERSION }}"

changelog:
  disable: true
