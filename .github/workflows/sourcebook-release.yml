name: Release Sourcebook

on:
  push:
    tags:
      - "sourcebook/v*"

permissions:
  contents: write

concurrency:
  group: sourcebook-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sourcebook/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Sourcebook release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "SOURCEBOOK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sourcebook/go.mod
          cache-dependency-path: sourcebook/go.sum

      - name: Test
        working-directory: sourcebook
        run: go test ./...

      # The OSS GoReleaser monorepo feature does not strip component tag
      # prefixes. Snapshot mode lets GoReleaser build the verified artifacts;
      # the following step publishes them to the original sourcebook/v* tag.
      - name: Build release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
          workdir: sourcebook
        env:
          SOURCEBOOK_VERSION: ${{ env.SOURCEBOOK_VERSION }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            sourcebook/dist/sourcebook_*.tar.gz
            sourcebook/dist/sourcebook_*.zip
            sourcebook/dist/checksums.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Sourcebook v${SOURCEBOOK_VERSION}" \
              --generate-notes \
              --verify-tag
          fi
